<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Catálogo de Filmes</title>
</head>

<body>
    <h2>Cadastrar Filme</h2>
    <form id="formFilme">
        <p>Título do Filme</p> <input type="text" id="titulo" placeholder="Digite o título do filme">
        <p>Avaliação (0 a 10)</p> <input type="number" id="avaliacao" min="0" max="10" step="0.1" placeholder="Ex: 8.5">
        <p>URL da Foto do Filme</p> <input type="url" id="foto" placeholder="Cole a URL da imagem">
        <p>Sinopse</p> <input type="text" id="sinopse" placeholder="Resumo do filme">
        <p>Diretor</p> <input type="text" id="diretor" placeholder="Nome do diretor">
        <p>Atores</p> <input type="text" id="atores" placeholder="Principais atores"> <br><br> <input type="submit" value="Cadastrar">
    </form>
</body>

</html>
