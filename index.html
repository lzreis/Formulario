<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Catálogo de Filmes</title>

    <!-- ligação com o CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Cadastrar Filme 🎬</h2>

    <form>

        <div class="longo">
            <p>Título do Filme</p>
            <input type="text" id="titulo" placeholder="Digite o título do filme">
        </div>

        <div class="longo">
            <p>Avaliação</p>
            <input type="number" id="avaliacao" placeholder="Ex: 8.5">
        </div>

        <div class="longo">
            <p>Foto (URL)</p>
            <input type="url" id="url" placeholder="Cole a URL da imagem">
        </div>

        <div class="longo">
            <p>Diretor</p>
            <input type="text" id="diretor" placeholder="Nome do diretor">
        </div>

        <div class="longo">
            <p>Sinopse</p>
            <input type="text" id="sinopse" placeholder="Resumo do filme">
        </div>

        <div class="longo">
            <p>Atores</p>
            <input type="text" id="atores" placeholder="Principais atores">
        </div>

        <div class="cadastrar">
            <input type="submit" value="Cadastrar">
        </div>

    </form>

    <form id="meuFormulario">
    <button type="submit">Adicionar</button>
</form>

<div id="colecao">
    </div>

</body>

</html>
